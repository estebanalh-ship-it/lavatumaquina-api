<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administración Lava tu Máquina</title>
    <style>
      /* Variables de color estilo Cyberpunk / Matrix */
      :root {
        --bg-color: #060506;
        --panel-color: #120819;
        --field-color: #1a0f24;
        --text-on-dark: #ffffff;
        --matrix-green: #00ff40;
        --purple-accent: #a855f7;
        --border-color: #2a153d;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-color);
        color: var(--text-on-dark);
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
      }

      .login-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 20px;
        width: 100%;
        max-width: 800px;
      }

      /* Estilo del contenedor y logo idéntico al index */
      .logo-container {
        width: min(720px, 92vw);
        text-align: center;
      }
      
      .logo-container a {
        display: inline-block;
        transition: all 0.3s ease-in-out;
      }

      .logo-container a:hover .logo,
      .logo-container a:focus .logo {
        box-shadow: 0 0 15px var(--purple-accent), 0 0 30px #581c87;
        border-color: var(--purple-accent);
        transform: translateY(-2px) scale(1.01);
      }

      .logo {
        width: 320px;
        height: auto;
        background-color: var(--panel-color);
        border-radius: 15px;
        border: 2px solid var(--border-color);
        padding: 4px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
        display: inline-block;
      }

      .card {
        width: min(720px, 92vw);
        background: var(--panel-color);
        padding: 32px;
        border-radius: 16px;
        border: 2px solid var(--border-color);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }

      .title {
        text-align: center;
        font-size: 1.5rem;
        margin: 0 0 20px 0;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--matrix-green);
        font-family: 'Courier New', Courier, monospace;
      }

      form { display: grid; gap: 16px; }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 640px) {
        .grid { grid-template-columns: 1fr; }
      }

      .box {
        background: rgba(255, 255, 255, 0.03);
        padding: 16px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
      }

      label {
        display: block;
        font-size: .9rem;
        margin-bottom: 8px;
        color: #d1d1d1;
      }

      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        background: var(--field-color);
        color: #ffffff;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input[type="email"]:focus,
      input[type="password"]:focus {
        border-color: var(--matrix-green);
        box-shadow: 0 0 8px rgba(0, 255, 64, 0.3);
      }

      input::placeholder { color: #6b7280; }

      .actions {
        display: flex;
        justify-content: center;
        margin-top: 10px;
      }

      /* Botón adaptado al estilo secundario de la app con acento verde Matrix */
      button[type="submit"] {
        width: 100%;
        max-width: 250px;
        padding: 14px 20px;
        border: 2px solid var(--matrix-green);
        border-radius: 10px;
        background: transparent;
        color: var(--matrix-green);
        font-weight: bold;
        font-size: 1rem;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease;
      }

      button[type="submit"]:hover {
        background: rgba(0, 255, 64, 0.15);
        color: #ffffff;
        box-shadow: 0 0 15px rgba(0, 255, 64, 0.4);
        transform: translateY(-2px);
      }

      .note {
        text-align: center;
        font-size: .85rem;
        color: var(--matrix-green);
        font-family: 'Courier New', Courier, monospace;
        letter-spacing: 0.5px;
        opacity: .9;
        margin-top: 10px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="login-wrapper">
      <div class="logo-container">
        <a href="/">
          <img src="/static/logo.png" alt="Lava Tu Máquina" class="logo">
        </a>
      </div>
      <main class="card">
        <h1 class="title">Administración</h1>

        <form action="{{ url_for('admin.login') }}" method="post">
          <section class="grid">
            <div class="box">
              <label for="email">Correo</label>
              <input id="email" name="email" type="email" placeholder="correo@ejemplo.com" autocomplete="username" required>
            </div>

            <div class="box">
              <label for="password">Contraseña</label>
              <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
          </section>

          <div class="actions">
            <button type="submit">Entrar</button>
          </div>

          <p class="note">¡SOMOS EL MEJOR CARWASH DE LA REGION!</p>
        </form>
      </main>
    </div>
  </body>
</html>
